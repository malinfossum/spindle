name: Commit identity

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  identity:
    name: Commit identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is mine and carries no attribution line
        env:
          ME: malinfossum.dev@proton.me
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          bad=0
          pattern='^(co-authored-by|claude-session|generated with)'

          for sha in $(git rev-list "$BASE".."$HEAD"); do
            author=$(git log -1 --format=%ae "$sha")
            committer=$(git log -1 --format=%ce "$sha")
            subject=$(git log -1 --format=%s "$sha")

            if [ "$author" != "$ME" ]; then
              echo "::error::$sha is authored by <$author>: $subject"
              bad=1
            fi
            case "$committer" in
              "$ME" | noreply@github.com) ;;
              *)
                echo "::error::$sha is committed by <$committer>: $subject"
                bad=1
                ;;
            esac
            if git log -1 --format=%B "$sha" | grep -qiE "$pattern"; then
              echo "::error::$sha carries an attribution line: $subject"
              bad=1
            fi
          done

          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE 'co-authored-by|claude-session|generated with'; then
            echo "::error::The pull request title or body carries an attribution line"
            bad=1
          fi

          if [ "$bad" -eq 0 ]; then
            echo "Every commit in $BASE..$HEAD is authored and committed by me."
          fi
          exit "$bad"
