<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">

    <!-- The Content-Security-Policy is a real response header now, written once
         in public/_headers and served by Cloudflare Pages. It is not repeated
         here: two copies of a policy are two things to keep in step, and only
         the header can express frame-ancestors. The dev server injects a
         relaxed copy of that same file while serving — see vite.config.js. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spindle</title>

    <!-- Synchronous and before the stylesheet on purpose: it sets data-theme on
         <html> before anything can paint. See the file for why it is not inline. -->
    <script src="/themePreload.js"></script>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <header class="Navbar">
        <h1><button class="brand-btn" type="button" data-action="nav" data-page="homePage">Spindle</button></h1>

        <div class="nav-desktop">
            <button id="nav-home-desktop" data-action="nav" data-page="homePage">Hjem</button>
            <button id="nav-wishlist-desktop" data-action="nav" data-page="wishList">Ønskeliste</button>

            <input class="nav-search-input" placeholder="Søkefelt" data-action-input="search-query">
            <button id="nav-search-desktop" data-action="nav" data-page="searchPage">Søk</button>

            <button id="nav-login-desktop" data-action="nav-login">Logg inn</button>
            <button id="nav-profile-desktop" style="display: none;" data-action="nav-profile">Profil</button>
        </div>

        <div class="nav-mobile" id="mobile-menu">
            <input class="nav-search-input" placeholder="Søkefelt" data-action-input="search-query">
            <button id="nav-search-mobile" data-action="nav" data-page="searchPage">Søk</button>
            <button class="navBurger" id="nav-burger" aria-label="Meny" data-action="toggle-menu">☰</button>

            <div class="mobile-menu-show">
                <button id="nav-home-mobile" data-action="nav" data-page="homePage">Hjem</button>
                <button id="nav-wishlist-mobile" data-action="nav" data-page="wishList">Ønskeliste</button>

                <button id="nav-login-mobile" data-action="nav-login">Logg inn</button>
                <button id="nav-profile-mobile" style="display: none;" data-action="nav-profile">Profil</button>
            </div>

        </div>


        <button class="btn-theme" data-action="toggle-theme" id="themeBtn" aria-label="Bytt tema (mørkt eller lyst)">🌙</button>

    </header>

    <div id="app"></div>

    <footer>
        <p id="footer-copyright">© 2026 Spindle</p>
    </footer>

    <!-- One entry point. Every other file is reached through its imports —
         see Controller/Universal/boot.js for why the load order stopped
         mattering. themePreload.js above stays a classic script on purpose:
         type="module" is deferred by definition, and a deferred theme is a
         theme flash. -->
    <script type="module" src="Controller/Universal/boot.js"></script>

</body>

</html>
