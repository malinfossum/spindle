<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spindle</title>

    <script>
        // Apply the stored theme before the stylesheet paints, so a light-theme
        // user doesn't get a dark flash on every load. Deliberately inline and
        // duplicating the prefs key: Model/prefs.js has not loaded yet, and
        // waiting for it would reintroduce the flash this prevents.
        try {
            const stored = JSON.parse(localStorage.getItem('spindle:v1:prefs') || '{}');
            if (stored.theme === 'light' || stored.theme === 'dark') {
                document.documentElement.setAttribute('data-theme', stored.theme);
            }
            if (stored.lang === 'no' || stored.lang === 'en') {
                document.documentElement.setAttribute('lang', stored.lang);
            }
        } catch (err) {
            /* No stored preferences, or storage is blocked — defaults apply. */
        }
    </script>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <header class="Navbar">
        <h1 onclick="changePage('homePage')">Spindle</h1>

        <div class="nav-desktop">
            <button id="nav-home-desktop" onclick="changePage('homePage')">Hjem</button>
            <button id="nav-wishlist-desktop" onclick="changePage('wishList')">Ønskeliste</button>

            <input class="nav-search-input" placeholder="Søkefelt" oninput="model.viewState.searchBar = this.value">
            <button id="nav-search-desktop" onclick="changePage('searchPage')">Søk</button>

            <button id="nav-login-desktop" onclick="handleLoginNavClick()">Logg inn</button>
            <button id="nav-profile-desktop" style="display: none;" onclick="handleProfileNavClick()">Profil</button>
        </div>

        <div class="nav-mobile" id="mobile-menu">
            <input class="nav-search-input" placeholder="Søkefelt" oninput="model.viewState.searchBar = this.value">
            <button id="nav-search-mobile" onclick="changePage('searchPage')">Søk</button>
            <button class="navBurger" id="nav-burger" aria-label="Meny" onclick="toggleMobileMenu()">☰</button>

            <div class="mobile-menu-show">
                <button id="nav-home-mobile" onclick="changePage('homePage')">Hjem</button>
                <button id="nav-wishlist-mobile" onclick="changePage('wishList')">Ønskeliste</button>

                <button id="nav-login-mobile" onclick="handleLoginNavClick()">Logg inn</button>
                <button id="nav-profile-mobile" style="display: none;" onclick="handleProfileNavClick()">Profil</button>
            </div>

        </div>


        <button class="btn-theme" onclick="toggleTheme()" id="themeBtn" aria-label="Bytt tema (mørkt eller lyst)">🌙</button>

    </header>

    <div id="app"></div>

    <footer>
        <p id="footer-copyright">© 2026 Spindle</p>
    </footer>

    <script src="Model/model.js"></script>
    <script src="Model/prefs.js"></script>
    <script src="Model/i18n/no.js"></script>
    <script src="Model/i18n/en.js"></script>
    <script src="Model/i18n/i18n.js"></script>
    <script src="Model/auth.js"></script>
    <script src="Model/persistence.js"></script>
    <script src="Model/backup.js"></script>

    <script src="View/Universal/escape.js"></script>
    <script src="View/Universal/sniff.js"></script>
    <script src="View/Universal/dialog.js"></script>
    <script src="View/Universal/backup.js"></script>

    <script src="View/Add_Or_Edit_New_Music/view.js"></script>
    <script src="View/Homepage/view.js"></script>
    <script src="View/Login/view.js"></script>
    <script src="View/Music_Details/view.js"></script>
    <script src="View/Profile/view.js"></script>
    <script src="View/Register/view.js"></script>
    <script src="View/Search/view.js"></script>
    <script src="View/Wishlist/view.js"></script>
    <script src="View/Welcome/view.js"></script>
    <script src="View/About/view.js"></script>
    <script src="View/NotFound/view.js"></script>

    <script src="View/Universal/albumCard.js"></script>
    <script src="Controller/Login/login.js"></script>
    <script src="View/Universal/updateView.js"></script>

    <script src="Controller/Edit_Music_Details/editMusic.js"></script>
    <script src="Controller/Music_Details/editBtn.js"></script>
    <script src="Controller/Register/register.js"></script>
    <script src="Controller/Search/search.js"></script>
    <script src="Controller/Universal/backup.js"></script>
    <script src="Controller/Universal/delete.js"></script>
    <script src="Controller/Universal/navbar&Mobile.js"></script>
    <script src="Controller/Universal/save.js"></script>
    <script src="Controller/Universal/storageSync.js"></script>
    <script src="Controller/Universal/viewMusicDetails.js"></script>

    <script>
        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') === 'light'
                ? 'light'
                : 'dark';
        }

        function themeIcon() {
            return currentTheme() === 'light' ? '☀️' : '🌙';
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', currentTheme());
            // Update every theme toggle (navbar + welcome). The navbar one is hidden
            // on the logged-out flow, so the welcome page carries its own.
            const icon = themeIcon();
            document.querySelectorAll('.btn-theme').forEach((btn) => {
                btn.textContent = icon;
            });
        }

        // Applies whatever spindle:v1:prefs holds right now. Used at boot, and
        // again when another tab changes the theme (task N).
        function applyStoredTheme() {
            document.documentElement.setAttribute('data-theme', getPref('theme'));
            applyTheme();
        }

        function toggleTheme() {
            const next = currentTheme() === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            setPref('theme', next);
            applyTheme();
        }

        // First render runs here — after every view + controller script has loaded —
        // so updateView() can safely call syncNavbar() and syncChrome().
        applyStoredTheme();
        applyLang();
        updateView();
    </script>
</body>

</html>
